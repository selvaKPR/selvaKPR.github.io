<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display app_temp from API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #temperature {
            margin-top: 20px;
        }
        input {
            padding: 5px;
            font-size: 16px;
        }
        button {
            padding: 5px 10px;
            font-size: 16px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Apparent Temperature</h1>
    
    <!-- Input field for entering the text to append to the API URL -->
    <input type="text" id="inputValue" placeholder="Enter value to append to URL">
    
    <!-- Button to trigger the fetch function -->
    <button onclick="fetchAndDisplayTemperature()">Get Temperature</button>
    
    <div id="temperature">
        <h2>Temperature: <span id="appTemp">Not available</span> °C</h2>
    </div>

    <script>
        // Function to fetch the app_temp value from the API with the appended input and display it
        function fetchAndDisplayTemperature() {
            const input = document.getElementById("inputValue").value; // Get the input value
            const apiUrl = `https://api.weatherbit.io/v2.0/current?&city=${input}&key=f79539052c804bf181a43e815185896a`; // Append the input to the API URL

            fetch(apiUrl)
                .then(response => response.json())  // Parse the JSON response
                .then(data => {
                    const appTemp = data.data[0].app_temp;  // Extract the app_temp value from the API response
                    document.getElementById("appTemp").textContent = appTemp;  // Display it in the HTML
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById("appTemp").textContent = "Error fetching data"; // Handle error case
                });
        }
    </script>
</body>
</html>
