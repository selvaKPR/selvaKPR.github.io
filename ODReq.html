<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form to Google Sheets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    form {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="submit"] {
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <form id="myForm">
    <label for="textInput">Enter text:</label>
    <input type="text" id="textInput" name="textInput" required>
    <input type="submit" value="Submit">
  </form>

  <script>
    document.getElementById('myForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent the form from reloading the page
      
      var textInput = document.getElementById('textInput').value;

      fetch('https://script.google.com/a/macros/kpriet.ac.in/s/AKfycbxhn_26JwdZGIKMBJBrldfPeEkPWxujwPnpTtK_tjgYWYfOjSppKlGieY3sST3nuBP2hA/exec', {  // Replace with your Web App URL
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'textInput=' + encodeURIComponent(textInput)
      })
      .then(response => response.text())
      .then(data => {
        alert('Data submitted: ' + textInput);
        document.getElementById('textInput').value = ''; // Clear input field
      })
      .catch(error => {
        alert('Error: ' + error);
      });
    });
  </script>
</body>
</html>
